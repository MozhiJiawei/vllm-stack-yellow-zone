version: 1

baseline:
  tp: 8
  submit_ranks: [0]
  dtype: bfloat16
  shape: [4, 5120]

defaults:
  repeat: 1
  startup_timeout: 600
  operator_timeout: 30
  hold_confirm_seconds: 3
  case_timeout: 900
  memory_limit_mib: 1024

scenarios:
